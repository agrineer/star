# FIXME:
# NOTE: edit in your own location as config does not see environment vars

# sets satellites to read and when
[satellites]
# number of predicted satellite tracks into the future
# gets updated after each pass
num_passes = 3

# minimum zenith elevation angle to trigger pass
zenith_min = 25.0

# elevation to trigger signal reception
sig_elev = 15.0

# satellites to track, must have same designation as in TLE file
active = NOAA 18,NOAA 19,METOP-A,METOP-B,METOP-C

# individual satellite tle file, read and process scripts
[NOAA 18]
read_script = /home/agrineer/star/scripts/dummy/read/dummy.py
proc_script = /home/agrineer/star/scripts/dummy/process/pscript_d
tle_file = /home/agrineer/star/orbits/weather.tle

[NOAA 19]
read_script = /home/agrineer/star/scripts/dummy/read/dummy.py
proc_script = /home/agrineer/star/scripts/dummy/process/pscript_d
tle_file = /home/agrineer/star/orbits/weather.tle

[METOP-A]
read_script = /home/agrineer/star/scripts/dummy/read/dummy.py
proc_script = /home/agrineer/star/scripts/dummy/process/pscript_d
tle_file = /home/agrineer/star/orbits/weather.tle

[METOP-C]
read_script = /home/agrineer/star/scripts/dummy/read/dummy.py
proc_script = /home/agrineer/star/scripts/dummy/process/pscript_d
tle_file = /home/agrineer/star/orbits/weather.tle

[METOP-B]
read_script = /home/agrineer/star/scripts/dummy/read/dummy.py
proc_script = /home/agrineer/star/scripts/dummy/process/pscript_d
tle_file = /home/agrineer/star/orbits/weather.tle

# specify the rotor module to use and offsets
[rotor]
# give it a name
name = dummy

# time it takes to execute motion in seconds
lead = 0.0

# antenna elevation offset
el_offset = 0.0

# antenna azimuth offset
az_offset = 0.0

# rotor module to use
module = /home/agrineer/star/rotors/dummy

# where the antenna is
[location]

# ASSIGN LOCATION HERE!

#FIXME: determine longitudal ranges (eg. 0 to +360, 0 to -360)
#       western hemisphere is given as -DDD.dddddd but not tested
#       east of Greenwich with +DDD.dddd nor with values => 180

# use decimal degrees and meters
latitude = 35.661842
longitude = -105.923291
altitude = 2198.0
name = agrineer, santa fe
