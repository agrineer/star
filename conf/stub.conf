proc_script = ${STAR_HOME}/scripts/stub/process/stub_process.py
tle_file = ${STAR_HOME}/orbits/weather_group.tle

[FENGYUN 3C]
read_script = ${STAR_HOME}/scripts/stub/read/stub_read.py
proc_script = ${STAR_HOME}/scripts/stub/process/stub_process.py
tle_file = ${STAR_HOME}/orbits/weather_group.tle

# specify the rotor module to use and offsets
[rotor]

# time it takes to execute motion in seconds
lead = 0.0

# antenna elevation offset
el_offset = 0.0

# antenna azimuth offset
az_offset = 0.0

# rotor module to use
module = ${STAR_HOME}/rotors/stub

# where the antenna is
[station]

#FIXME: determine longitudal ranges (eg. 0 to +360, 0 to -360)
#       western hemisphere is given as -DDD.dddddd but not tested
#       east of Greenwich with +DDD.dddd nor with values => 180

name = your location name

# use decimal degrees 
latitude = xx.xxxxxx    
longitude = xx.xxxxxx    

# meters
altitude = xxxx.x
