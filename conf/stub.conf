# FIXME: suntrack.py does not preserve comments on its rewrite of this file

# sets satellites to read and when
[satellites]
# number of predicted satellite tracks into the future
# gets updated after each pass
num_passes = 3

# minimum zenith elevation angle to trigger pass
zenith_min = 25.0

# elevation to trigger signal reception
sig_elev = 15.0

# satellites to track, must have same designation as in TLE file
active = NOAA 20,METOP-B,METOP-C,FENGYUN 3A,FENGYUN 3B,FENGYUN 3C 

# individual satellite tle file, read and process scripts
[NOAA 20]
read_script = ${STAR_HOME}/scripts/stub/read/stub_read.py
proc_script = ${STAR_HOME}/scripts/stub/process/stub_process.py
tle_file = ${STAR_HOME}/orbits/weather_group.tle

[METOP-A]
read_script = ${STAR_HOME}/scripts/stub/read/stub_read.py
proc_script = ${STAR_HOME}/scripts/stub/process/stub_process.py
tle_file = ${STAR_HOME}/orbits/weather_group.tle

[METOP-C]
read_script = ${STAR_HOME}/scripts/stub/read/stub_read.py
proc_script = ${STAR_HOME}/scripts/stub/process/stub_process.py
tle_file = ${STAR_HOME}/orbits/weather_group.tle

[METOP-B]
read_script = ${STAR_HOME}/scripts/stub/read/stub_read.py
proc_script = ${STAR_HOME}/scripts/stub/process/stub_process.py
tle_file = ${STAR_HOME}/orbits/weather_group.tle

[FENGYUN 3A]
read_script = ${STAR_HOME}/scripts/stub/read/stub_read.py
proc_script = ${STAR_HOME}/scripts/stub/process/stub_process.py
tle_file = ${STAR_HOME}/orbits/weather_group.tle

[FENGYUN 3B]
